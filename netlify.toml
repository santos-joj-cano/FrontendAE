# Configuración de compilación para Netlify
[build]
  command = "ng build --configuration production"
  publish = "dist/FrontendAE/browser"

# Regla de reescritura para que todas las peticiones vayan al servidor
# El plugin se encargará de crear la función "server" automáticamente
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

# Reglas para el caché de los assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"